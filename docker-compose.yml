services:
  flask:
    build: .
    container_name: p2p-flask
    ports:
      - "4040:5000"
    depends_on:
      - db
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-only-change-me}
      - DATABASE_URL=mysql+pymysql://p2p:${MYSQL_PASSWORD:-local-db-only}@db/p2p
      - TZ=America/Lima
    volumes:
      - .:/app

  db:
    build:
      context: .
      dockerfile: dockerfile.db
    container_name: p2p-db
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-local-root-only}
      - MYSQL_DATABASE=p2p
      - MYSQL_USER=p2p
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-local-db-only}
      - TZ=America/Lima

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: p2p-phpmyadmin
    ports:
      - "4041:80"
    depends_on:
      - db
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-local-root-only}
      - TZ=America/Lima


volumes:
  mysql_data:
